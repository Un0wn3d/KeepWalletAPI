services:
  postgres:
    image: postgres:16-alpine
    container_name: keepwallet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-KeepWallet}
      POSTGRES_USER: ${POSTGRES_USER:-KeepWallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - keepwallet_postgres_data:/var/lib/postgresql/data
      - ./docker/initdb/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-KeepWallet} -d ${POSTGRES_DB:-KeepWallet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  keepwallet_postgres_data:
