name: KeepWalletAPI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Tests/KeepWalletAPI.Tests/KeepWalletAPI.Tests.csproj
      - name: Test
        run: dotnet test Tests/KeepWalletAPI.Tests/KeepWalletAPI.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=detailed"
